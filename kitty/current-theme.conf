color9 #FF8A80

# green
color2  #81C995
color10 #A8E6A1

# yellow
color3  #FDD633
color11 #FFE066

# blue
color4  #2196F3
color12 #64B5F6

# magenta
color5  #CE93D8
color13 #E1BEE7

