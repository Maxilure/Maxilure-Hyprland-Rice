# vim:ft=kitty

## name:     Graphite
## blurb:    Monochrome dark palette matched to the Graphite GTK theme

# The basic colors
foreground              #E0E0E0
background              #121212
selection_foreground    #121212
selection_background    #E0E0E0

# Cursor colors
cursor                  #E0E0E0
cursor_text_color       #121212

# URL underline color when hovering with mouse
url_color               #64B5F6

# Kitty window border colors
active_border_color     #E0E0E0
inactive_border_color   #444444
bell_border_color       #FDD633

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #121212
active_tab_background   #E0E0E0
inactive_tab_foreground #E0E0E0
inactive_tab_background #1B1B1B
tab_bar_background      #0F0F0F

# Colors for marks (marked text in the terminal)
mark1_foreground #121212
mark1_background #E0E0E0
mark2_foreground #121212
mark2_background #CE93D8
mark3_foreground #121212
mark3_background #4DD0E1

