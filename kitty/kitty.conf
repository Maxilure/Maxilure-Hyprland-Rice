font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

background_opacity 1

# Graphite color scheme
# Matched to the Graphite GTK theme's dark/Material-style palette
# foreground              #e0e0e0
# background              #121212
# selection_foreground    #121212
# selection_background    #e0e0e0
# cursor                  #e0e0e0
# cursor_text_color       #121212
# scrollbar_handle_color  #444444
# scrollbar_track_color   #2e2e2e
# url_color               #64b5f6
# active_border_color     #e0e0e0
# inactive_border_color   #444444
# bell_border_color       #fdd633
# wayland_titlebar_color system
# macos_titlebar_color system
# active_tab_foreground   #121212
# active_tab_background   #e0e0e0
# inactive_tab_foreground #e0e0e0
# inactive_tab_background #1b1b1b
# tab_bar_background      #0f0f0f
# mark1_foreground #121212
# mark1_background #e0e0e0
# mark2_foreground #121212
# mark2_background #ce93d8
# mark3_foreground #121212
# mark3_background #4dd0e1
# color0 #0f0f0f
# color8 #444444
# color1 #f28b82
# color9 #ff8a80
# color2  #81c995
# color10 #a8e6a1
# color3  #fdd633
# color11 #ffe066
# color4  #2196f3
# color12 #64b5f6
# color5  #ce93d8
# color13 #e1bee7
# color6  #4dd0e1
# color14 #80deea
# color7  #e0e0e0
# color15 #ffffff


# BEGIN_KITTY_THEME
# Graphite
include current-theme.conf
# END_KITTY_THEME

tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}